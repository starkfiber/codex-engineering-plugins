name: Evidence correction or proposal
description: Improve a topic, verification result or feature
body:
  - type: textarea
    id: finding
    attributes:
      label: Question, topic ID and proposed correction or feature
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources, exact versions and observations
      description: Distinguish observations from inference. Do not upload private cases or credentials.
  - type: textarea
    id: checks
    attributes:
      label: Reproduction and acceptance checks
